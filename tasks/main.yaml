---
- name: "Update existing packages"
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
    upgrade: "dist"
    autoclean: true
  become: true
  tags:
    - "apt:upgrade"

- name: "Add repository"
  ansible.builtin.deb822_repository:
    name: "{{ item.name }}"
    types: "{{ item.types | default('deb') }}"
    uris: "{{ item.uris }}"
    suites: "{{ item.suites | default(ansible_facts['distribution_release']) }}"
    components: "{{ item.components }}"
    signed_by: "{{ item.signed_by | default(omit) }}"
    architectures: "{{ item.architecture | default(omit) }}"
  loop: "{{ apt_repositories }}"

- name: "Install packages (apt)"
  ansible.builtin.apt:
    name: "{{ apt_apt_packages | default([]) }}"
    state: "present"
    update_cache: true
    force_apt_get: true
  become: true
  tags:
    - "apt:install"

- name: "Install packages(dpkg)"
  ansible.builtin.apt:
    deb: "{{ item }}"
  become: true
  loop: "{{ apt_deb_packages | default([]) }}"
  tags:
    - "apt:install"
    - "apt:dpkg"
...
